[project]
name = "consent-pipeline"
version = "0.1.0"
requires-python = ">= 3.12"
dependencies = [
    "pyspark==3.5.1",
    "azure-eventhub==5.14.0",
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
